<div class="relative min-h-dvh flex flex-col overflow-hidden bg-surface-50 dark:bg-surface-950">

    <div class="auth-bg" aria-hidden="true">
        <span class="auth-glow auth-glow--top"></span>
        <span class="auth-glow auth-glow--bottom"></span>
        <span class="auth-grid"></span>
        <span class="auth-ring auth-ring--lg"></span>
        <span class="auth-ring auth-ring--sm"></span>
    </div>

    <main class="relative flex-1 flex flex-col items-center justify-center px-6 py-10 sm:py-14">
        <a routerLink="/" class="mb-8 sm:mb-10" aria-label="Volver al inicio">
            <img src="/logo/logo-creditia-vertical.svg" alt="Credit-ia" class="h-24 sm:h-32 w-auto" />
        </a>


        <section class="w-full max-w-md rounded-2xl border border-surface-200 dark:border-surface-800 bg-surface-0/95 dark:bg-surface-900/90 backdrop-blur-sm p-6 sm:p-8">
            @if (heading()) {
                <header class="mb-6">
                    <h1 class="text-2xl font-semibold m-0">{{ heading() }}</h1>
                    @if (description()) {
                        <p class="text-muted-color m-0 mt-2">{{ description() }}</p>
                    }
                </header>
            }

            <ng-content />
        </section>

        <div class="w-full max-w-2xl">
            <ng-content select="[authBelow]" />
        </div>
    </main>

    <footer class="relative px-6 py-6 border-t border-surface">
        <div class="max-w-5xl mx-auto flex flex-col-reverse sm:flex-row items-center justify-between gap-3 text-m text-muted-color text-center">
            <span class="sm:whitespace-nowrap">&copy; {{ year }} Credit-ia &mdash; un producto de Ruser Consultores S.A.S &middot; NIT 901.691.260</span>
            <nav class="flex items-center gap-4 whitespace-nowrap">
                <a routerLink="/legal/terminos" class="no-underline hover:text-primary transition-colors">Términos</a>
                <a routerLink="/legal/privacidad" class="no-underline hover:text-primary transition-colors">Privacidad</a>
                <a routerLink="/legal/habeas-data" class="no-underline hover:text-primary transition-colors">Habeas Data</a>
            </nav>
        </div>
    </footer>
</div>
