<div
    class="rounded-2xl border p-5 flex flex-col gap-4 bg-surface-0 dark:bg-surface-900/40 h-full transition-all duration-200"
    [class.border-surface]="!belowMin()"
    [class.border-red-400]="belowMin()"
    [class.opacity-55]="dimmed()"
>
    <!-- Encabezado: ícono + nombre + interruptor -->
    <div class="flex items-center gap-2 min-w-0">
        <span class="flex items-center justify-center w-9 h-9 rounded-lg bg-primary/10 shrink-0">
            <i [class]="icon() + ' text-primary'"></i>
        </span>
        <span class="font-semibold text-color leading-tight flex-1 min-w-0">{{ label() }}</span>

        @if (required()) {
        <i class="pi pi-lock text-muted-color text-sm"
           pTooltip="Dimensión obligatoria: no se puede desactivar." tooltipPosition="left"></i>
        } @else {
        <p-toggleswitch
            [(ngModel)]="enabled"
            [disabled]="!canToggle()"
            pTooltip="Activa o desactiva esta dimensión en el cálculo del score."
            tooltipPosition="left"
        />
        }
    </div>

    @if (enabled()) {
    <!-- Porcentaje destacado -->
    <div class="flex items-end justify-center py-1">
        @if (editing()) {
        <p-inputNumber
            [(ngModel)]="weight"
            [min]="0"
            [max]="100"
            suffix=" %"
            [showButtons]="false"
            inputStyleClass="w-28 text-center text-2xl font-extrabold"
            [invalid]="belowMin()"
        />
        } @else {
        <span class="text-4xl font-extrabold tabular-nums text-color leading-none">{{ weight() }}<span class="text-xl text-muted-color font-bold ml-0.5">%</span></span>
        }
    </div>

    <!-- Slider (interactivo al editar; solo lectura como barra al ver) -->
    <p-slider
        [(ngModel)]="weight"
        [min]="0"
        [max]="100"
        [disabled]="!editing()"
        styleClass="w-full"
    />

    @if (editing() && belowMin()) {
    <small class="text-red-500">Mínimo {{ minWeight() }} % por dimensión.</small>
    }
    } @else {
    <!-- Deshabilitada: no cuenta para el score -->
    <div class="flex items-center justify-center py-3">
        <span class="text-sm text-muted-color italic">No cuenta para el score</span>
    </div>
    }

    <!-- Descripción siempre visible de qué mide la dimensión -->
    <p class="text-sm text-muted-color leading-relaxed m-0 mt-auto">{{ description() }}</p>
</div>
