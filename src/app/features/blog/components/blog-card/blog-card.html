@let p = post();

<a
    [routerLink]="['/blog', p.slug]"
    class="group flex flex-col h-full rounded-2xl border border-surface bg-surface-0 dark:bg-surface-900 overflow-hidden no-underline
           transition-all duration-300 ease-out hover:shadow-xl hover:-translate-y-1 hover:border-primary/40
           focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40"
>
    <!-- Portada -->
    <div class="relative aspect-[16/9] overflow-hidden">
        @if (p.coverImageUrl) {
            <img
                [src]="p.coverImageUrl"
                [alt]="p.title"
                loading="lazy"
                class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
            />
        } @else {
            <!-- Placeholder de marca cuando no hay portada -->
            <div class="w-full h-full flex items-center justify-center bg-linear-to-br from-primary/80 to-primary-emphasis">
                <i class="pi pi-book text-white/90 text-5xl"></i>
            </div>
        }
        <!-- Badge de categoría -->
        <span class="absolute top-3 left-3 inline-flex items-center gap-1 text-sm font-semibold px-3 py-1 rounded-full bg-surface-0/90 dark:bg-surface-900/90 text-primary backdrop-blur-sm">
            <i class="pi pi-tag text-[10px]"></i>
            {{ p.category.name }}
        </span>
    </div>

    <!-- Cuerpo -->
    <div class="flex flex-col flex-1 p-6">
        <h3 class="text-lg font-bold text-color leading-snug m-0 mb-2 line-clamp-2 group-hover:text-primary transition-colors">
            {{ p.title }}
        </h3>
        <p class="text-m text-muted-color leading-relaxed m-0 mb-5 line-clamp-3">
            {{ p.excerpt }}
        </p>

        <!-- Pie: autor + meta (mt-auto lo fija al fondo para alinear tarjetas) -->
        <div class="flex items-center gap-3 mt-auto pt-4 border-t border-surface">
            @if (p.author.avatarUrl) {
                <img [src]="p.author.avatarUrl" [alt]="p.author.name" class="w-9 h-9 rounded-full object-cover shrink-0" />
            } @else {
                <span class="w-9 h-9 rounded-full bg-primary/10 text-primary text-sm font-bold flex items-center justify-center shrink-0">
                    {{ authorInitials() }}
                </span>
            }
            <div class="min-w-0 flex-1">
                <p class="text-m font-medium text-color m-0 truncate">{{ p.author.name }}</p>
                <p class="text-sm text-muted-color m-0">
                    {{ p.publishedAt | date:'d MMM y' }} · {{ p.readingMinutes }} min
                </p>
            </div>
            <i class="pi pi-arrow-right text-muted-color group-hover:text-primary group-hover:translate-x-1 transition-all"></i>
        </div>
    </div>
</a>
