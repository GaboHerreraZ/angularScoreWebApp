<app-notification />

<div class="min-h-screen flex flex-col bg-surface-100 dark:bg-surface-950">
    <!-- Barra superior ligera: logo + cerrar sesión (sin borde de header) -->
    <div class="max-w-screen-xl w-full mx-auto px-6 pt-5 flex items-center justify-between">
        <a routerLink="/" class="no-underline">
            <img [src]="logo()" alt="Creditia" class="h-12 w-auto" />
        </a>
        <p-button
            label="Cerrar sesión"
            icon="pi pi-sign-out"
            severity="secondary"
            [text]="true"
            size="small"
            (onClick)="signOut()"
        />
    </div>

    <!-- Contenido del flujo -->
    <main class="flex-1 w-full">
        <router-outlet />
    </main>

    <!-- Footer -->
    <footer class="px-6 py-5 border-t border-surface bg-surface-0 dark:bg-surface-900">
        <div class="max-w-screen-xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-muted-color">
            <span>© {{ year }} CREDITIA. Todos los derechos reservados.</span>
            <nav class="flex items-center gap-4">
                <a routerLink="/legal/terminos" class="hover:text-primary no-underline transition-colors">Términos</a>
                <a routerLink="/legal/privacidad" class="hover:text-primary no-underline transition-colors">Privacidad</a>
                <a routerLink="/legal/habeas-data" class="hover:text-primary no-underline transition-colors">Habeas Data</a>
            </nav>
        </div>
    </footer>
</div>
