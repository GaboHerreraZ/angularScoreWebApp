<section class="landing-aurora px-6 sm:px-12 lg:px-20 py-12 lg:py-16 bg-surface-0 dark:bg-surface-950">
    <div class="max-w-screen-xl mx-auto">
        <!-- Trust pills -->
        <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 mb-12 text-m font-medium text-muted-color" appScrollAnimate="fade-up">
            <span class="inline-flex items-center gap-2"><i class="pi pi-check-circle text-emerald-500"></i> Pago único por paquete</span>
            <span class="inline-flex items-center gap-2"><i class="pi pi-check-circle text-emerald-500"></i> Mejor precio a mayor volumen</span>
            <span class="inline-flex items-center gap-2"><i class="pi pi-check-circle text-emerald-500"></i> Sin permanencia</span>
        </div>

        @if (packsResource.isLoading()) {
            <!-- Skeleton mientras carga el catálogo -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                @for (i of [1, 2, 3]; track i) {
                    <div class="rounded-2xl border border-surface p-7">
                        <p-skeleton width="40%" height="1rem" styleClass="mb-4" />
                        <p-skeleton width="60%" height="3rem" styleClass="mb-3" />
                        <p-skeleton width="100%" height="1rem" styleClass="mb-6" />
                        <p-skeleton width="50%" height="2rem" styleClass="mb-6" />
                        <p-skeleton width="100%" height="2.75rem" />
                    </div>
                }
            </div>
        } @else if (packsResource.error()) {
            <!-- Fallback si el catálogo no carga: igual invitamos a registrarse -->
            <div class="landing-card rounded-2xl border border-surface bg-surface-50 dark:bg-surface-900 p-10 text-center">
                <i class="pi pi-box text-4xl text-muted-color mb-4"></i>
                <p class="text-muted-color mb-6">No pudimos cargar los paquetes en este momento, pero puedes registrarte y verlos al momento de comprar.</p>
                <p-button label="Registrarme" icon="pi pi-arrow-right" iconPos="right" (onClick)="goToRegister()" />
            </div>
        } @else {
            <div appScrollAnimate="fade-up">
                <app-card-carousel [items]="packs()">
                    <ng-template let-pack>
                        <app-pack-display-card
                            [pack]="pack"
                            [featured]="pack.id === featuredId()"
                            (register)="buyPack($event)"
                        />
                    </ng-template>
                </app-card-carousel>
            </div>

            <!-- Qué incluye cada análisis (una sola vez, aplica a todos los packs) -->
            <app-pack-included-features class="block mt-8" appScrollAnimate="fade-up" />
        }
    </div>
</section>
