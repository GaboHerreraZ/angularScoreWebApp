<section id="faq" class="landing-band px-6 sm:px-12 lg:px-20 py-16 lg:py-24">
    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-16" appScrollAnimate="fade-up">
            <span class="text-primary font-bold text-m uppercase tracking-widest">FAQ</span>
            <h2 class="font-extrabold text-3xl sm:text-4xl lg:text-5xl mt-3 mb-4 text-color">Preguntas frecuentes</h2>
            <p class="text-lg text-muted-color max-w-2xl mx-auto">{{ subtitle() }}</p>
        </div>

        <p-accordion appScrollAnimate="fade-up" [animateDelay]="100" [multiple]="true" expandIcon="pi pi-plus" collapseIcon="pi pi-minus">
            @for (item of items(); track item.question) {
                <p-accordion-panel [value]="$index">
                    <p-accordion-header>{{ item.question }}</p-accordion-header>
                    <p-accordion-content>
                        <p class="text-muted-color leading-relaxed m-0" [innerHTML]="item.answer"></p>
                    </p-accordion-content>
                </p-accordion-panel>
            }
        </p-accordion>
    </div>
</section>
