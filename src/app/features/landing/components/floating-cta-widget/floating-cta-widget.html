<div
    class="fixed bottom-6 right-6 z-50 transition-all duration-300 ease-out"
    [class.opacity-0]="!visible()"
    [class.translate-y-4]="!visible()"
    [class.pointer-events-none]="!visible()"
>
    @if (isAuthenticated()) {
        <button
            pButton
            pRipple
            rounded
            label="Ir al Dashboard"
            icon="pi pi-arrow-right"
            iconPos="right"
            class="shadow-xl shadow-primary/30 px-6 py-3 text-base"
            (click)="goToDashboard()"
            aria-label="Ir al Dashboard"
        ></button>
    } @else {
        <button
            pButton
            pRipple
            rounded
            label="Registrarme"
            icon="pi pi-arrow-right"
            iconPos="right"
            class="shadow-xl shadow-primary/30 px-6 py-3 text-base"
            (click)="goToRegister()"
            aria-label="Registrarme en Creditia"
        ></button>
    }
</div>
