<app-notification />

<app-auth-layout heading="Nueva contraseña" description="Ingresa tu nueva contraseña para tu cuenta.">
    <form [formGroup]="form" (ngSubmit)="submit()">
        <p-floatlabel variant="on" class="w-full mb-5">
            <p-password inputId="password" formControlName="password" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
            <label for="password">Nueva contraseña</label>
        </p-floatlabel>

        <p-floatlabel variant="on" class="w-full mb-2">
            <p-password inputId="confirm" formControlName="confirm" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" />
            <label for="confirm">Confirmar contraseña</label>
        </p-floatlabel>

        @if (form.errors?.['mismatch'] && form.controls.confirm.touched) {
            <small class="text-red-500 mb-2 block">Las contraseñas no coinciden.</small>
        }

        @if (form.controls.password.touched && form.controls.password.errors?.['minlength']) {
            <small class="text-red-500 mb-2 block">La contraseña debe tener al menos 6 caracteres.</small>
        }

        <div class="mb-4"></div>

        <p-button type="submit" label="Guardar contraseña" styleClass="w-full" [loading]="loading()" [disabled]="form.invalid || loading()" icon="pi pi-check" />
    </form>

    <!-- Enlaces de navegacion -->
    <div authBelow class="flex items-center justify-center gap-2 mt-6 text-m">
        <a routerLink="/" class="text-muted-color cursor-pointer no-underline hover:text-primary-500 hover:underline flex items-center gap-1">
            <i class="pi pi-home text-sm"></i> Volver al inicio
        </a>
        <span class="text-surface-300 dark:text-surface-600">·</span>
        <a routerLink="/auth/iniciar-sesion" class="text-primary-500 font-medium cursor-pointer no-underline hover:underline">Iniciar sesión</a>
    </div>
</app-auth-layout>
