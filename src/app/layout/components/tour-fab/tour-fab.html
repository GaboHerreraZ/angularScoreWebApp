@if (visible()) {
    <div class="tour-fab" data-tour="tour-fab" [class.has-hint]="showHint()">
        <p-button
            icon="pi pi-graduation-cap"
            severity="help"
            [rounded]="true"
            [raised]="true"
            [pTooltip]="tooltip()"
            tooltipPosition="left"
            [ariaLabel]="tooltip()"
            (onClick)="open()"
        />
    </div>
}

<p-dialog
    [visible]="guidesVisible()"
    (visibleChange)="guidesVisible.set($event)"
    (onHide)="onDialogHide()"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [dismissableMask]="true"
    header="Guías de esta pantalla"
    styleClass="w-full max-w-md mx-4"
>
    <p class="text-m text-surface-500 mb-4">Recorridos cortos sobre lo que puedes hacer aquí. Puedes repetirlos cuando quieras.</p>

    <ul class="list-none m-0 p-0 flex flex-col gap-2">
        @for (tour of tours(); track tour.id) {
            <li>
                <button
                    type="button"
                    class="w-full flex items-start gap-3 text-left p-3 rounded-border border border-surface-200 dark:border-surface-700 hover:border-primary hover:bg-emphasis transition-colors duration-150 cursor-pointer"
                    (click)="startTour(tour.id)"
                >
                    <span class="inline-flex items-center justify-center w-9 h-9 shrink-0 rounded-full bg-primary/10">
                        <i [class]="tour.icon + ' text-primary'"></i>
                    </span>
                    <span class="min-w-0 flex-1">
                        <span class="flex items-center gap-2">
                            <span class="font-semibold text-m text-surface-800 dark:text-surface-100">{{ tour.title }}</span>
                            @if (isCompleted(tour.id)) {
                                <i class="pi pi-check-circle text-green-500 text-sm" title="Ya la viste"></i>
                            }
                        </span>
                        <span class="block text-sm text-surface-500 mt-0.5">{{ tour.description }}</span>
                        @if (tour.minutes) {
                            <span class="block text-sm text-surface-400 mt-1">
                                <i class="pi pi-clock text-[10px] mr-1"></i>{{ tour.minutes }} min
                            </span>
                        }
                    </span>
                    <i class="pi pi-play-circle text-surface-400 mt-1"></i>
                </button>
            </li>
        }
    </ul>
</p-dialog>
